apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: patch-smee-pac-downstream
  annotations:
    tekton.dev/displayName: 'Patch smee → PaC downstream URL'
    tekton.dev/categories: 'Pipeline'
    tekton.dev/tags: 'e2e,smee,pipelines-as-code'
spec:
  description: >-
    Ensures the gosmee health-check-sidecar forwards webhooks to the
    in-cluster Pipelines-as-Code controller.

    deploy-konflux-ci rewrites pipelines-as-code-controller URLs in
    dependencies/smee/smee-client.yaml to the kind node external IP. That
    breaks forwarding on remote kind (no PaC listener on that host port):
    smee receives GitHub events but Post to localhost:8080 times out, and
    no on-pull PipelineRuns are created. This task restores the in-cluster
    Service DNS name.
  params:
    - name: cluster-access-secret
      type: string
      description: Secret with kubeconfig for the kind cluster (kfg-<pipelinerun>).
    - name: downstream-url
      type: string
      default: 'http://pipelines-as-code-controller.pipelines-as-code:8180'
      description: >-
        URL the smee sidecar should POST webhooks to (in-cluster PaC service).
  volumes:
    - name: cluster-credentials
      secret:
        secretName: $(params.cluster-access-secret)
  steps:
    - name: patch-smee-downstream
      image: quay.io/konflux-ci/tekton-integration-catalog/utils@sha256:79707a56aa34a59f8ebb97db855114b840cbbf60bece4a0edf8ef8c7d7d5acd1
      env:
        - name: KUBECONFIG
          value: /cluster-credentials/kubeconfig
        - name: DOWNSTREAM_URL
          value: $(params.downstream-url)
      volumeMounts:
        - name: cluster-credentials
          mountPath: /cluster-credentials
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "=== Patching smee sidecar DOWNSTREAM_SERVICE_URL ==="
        echo "Target: ${DOWNSTREAM_URL}"

        if ! kubectl get deployment/gosmee-client -n smee-client &>/dev/null; then
          echo "ERROR: deployment/gosmee-client not found in smee-client"
          kubectl get deploy,po -n smee-client || true
          exit 1
        fi

        echo "=== Current gosmee-client containers / env ==="
        kubectl get deployment/gosmee-client -n smee-client -o json | jq -r '
          .spec.template.spec.containers[] |
          "container=\(.name)",
          (.args // [] | "  args=\(.)"),
          ((.env // [])[] | "  env \(.name)=\(.value // .valueFrom)")
        '

        get_downstream() {
          kubectl get deployment/gosmee-client -n smee-client -o json | jq -r '
            .spec.template.spec.containers[]
            | select(.name == "health-check-sidecar")
            | (.env // [])[]
            | select(.name == "DOWNSTREAM_SERVICE_URL")
            | .value // empty
          '
        }

        CURRENT="$(get_downstream)"
        echo "Current DOWNSTREAM_SERVICE_URL: ${CURRENT:-<unset>}"

        if [[ "${CURRENT}" == "${DOWNSTREAM_URL}" ]]; then
          echo "Already correct — no patch needed."
        else
          echo "Patching health-check-sidecar DOWNSTREAM_SERVICE_URL..."
          kubectl set env deployment/gosmee-client -n smee-client \
            -c health-check-sidecar \
            "DOWNSTREAM_SERVICE_URL=${DOWNSTREAM_URL}"
        fi

        echo "=== Waiting for gosmee-client rollout ==="
        kubectl rollout status deployment/gosmee-client -n smee-client --timeout=3m

        echo "=== Verifying PaC controller Service exists ==="
        kubectl get svc pipelines-as-code-controller -n pipelines-as-code

        echo "=== Patched DOWNSTREAM_SERVICE_URL: $(get_downstream)"
        echo "=== Done ==="
