        # if kubectl get deployment/gosmee-client -n smee-client &>/dev/null \
        #   && kubectl get svc pipelines-as-code-controller -n pipelines-as-code &>/dev/null; then
        #   PAC_DOWNSTREAM="http://pipelines-as-code-controller.pipelines-as-code:8180"
        #   echo "DOWNSTREAM_SERVICE_URL=${PAC_DOWNSTREAM}"
        #   kubectl set env deployment/gosmee-client -n smee-client \
        #     -c health-check-sidecar \
        #     "DOWNSTREAM_SERVICE_URL=${PAC_DOWNSTREAM}"
        #   kubectl rollout status deployment/gosmee-client -n smee-client --timeout=3m
        # else
        #   echo "WARNING: smee or PaC service missing; skipping downstream patch"
        # fi

        # # Kind e2e: Kyverno admission often flaps under build load (OOM/restart).
        # # With failurePolicy=Fail, "connection refused" aborts TaskRun pod creates
        # # mid-pipeline (e.g. deprecated-base-image-check) and fails the suite.
        # # Wait for Ready, give the controller more memory, and set failurePolicy
        # # to Ignore so brief webhook outages do not kill PipelineRuns.
