apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-konflux-operator
  annotations:
    tekton.dev/displayName: 'Deploy Konflux via Operator'
    tekton.dev/categories: 'Pipeline'
    tekton.dev/tags: 'e2e,konflux-ui,deploy,operator'
    tekton.dev/pipelines.minVersion: '0.44.x'
spec:
  description: >-
    Deploys Konflux onto an already-provisioned Kind cluster by wrapping
    konflux-ci's scripts/deploy-local.sh (same path as the GitHub
    konflux-ui-deploy-test action). Maps build-credentials into the env
    vars that script expects, skips Kind creation, then pushes logs to OCI.
  params:
    - name: cluster-access-secret
      type: string
      description: Secret with kubeconfig for the Kind cluster (kfg-<pipelinerun>).
    - name: repo-url
      type: string
      description: konflux-ci Git repository (provides deploy-local.sh).
      default: https://github.com/konflux-ci/konflux-ci.git
    - name: repo-revision
      type: string
      description: Git revision to clone for deploy scripts.
      default: main
    - name: operator-release
      type: string
      description: >-
        Release tag for install.yaml / samples (e.g. v0.1.13), or "latest".
        Pin after the first green run.
      default: latest
    - name: oci-ref
      type: string
      description: Full OCI artifact reference used to store deploy logs.
    - name: oci-credentials
      type: string
      description: Secret with oci-storage-dockerconfigjson for pushing deploy logs.
    - name: build-credentials
      type: string
      description: >-
        Secret with quay-org-name, quay-org-token, gh-app-id,
        gh-app-private-key, gh-app-webhook-secret, smee-channel.
  volumes:
    - name: cluster-credentials
      secret:
        secretName: $(params.cluster-access-secret)
    - name: workdir
      emptyDir: {}
    - name: logs
      emptyDir: {}
    - name: oci-credentials
      secret:
        secretName: $(params.oci-credentials)
    - name: build-credentials
      secret:
        secretName: $(params.build-credentials)
  stepTemplate:
    env:
      - name: KUBECONFIG
        value: /cluster-credentials/kubeconfig
      - name: LOG_FILENAME
        value: /var/log-dir/deploy-konflux-operator.log
    volumeMounts:
      - name: cluster-credentials
        mountPath: /cluster-credentials
      - name: workdir
        mountPath: /var/workdir
      - name: logs
        mountPath: /var/log-dir/
      - name: build-credentials
        mountPath: /build-credentials
  steps:
    - name: clone-konflux-ci
      image: quay.io/openshift-pipeline/pipelines-git-init-rhel9@sha256:7eee14366c516d92cf7480c9bc256cf0e544bf06da5d46ffb5e8bfe3e448326c
      onError: continue
      workingDir: /var/workdir
      securityContext:
        runAsUser: 0
      args:
        - -url=$(params.repo-url)
        - -revision=$(params.repo-revision)
        - -path=.

    - name: deploy-local
      image: quay.io/konflux-ci/tekton-integration-catalog/utils@sha256:79707a56aa34a59f8ebb97db855114b840cbbf60bece4a0edf8ef8c7d7d5acd1
      onError: continue
      workingDir: /var/workdir
      env:
        - name: OPERATOR_RELEASE
          value: $(params.operator-release)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        {
          echo "=== Deploy Konflux via scripts/deploy-local.sh ==="
          kubectl cluster-info

          # Map IT build-credentials secret keys → deploy-local.sh / deploy-secrets.sh env.
          export GITHUB_APP_ID=$(< /build-credentials/gh-app-id)
          export GITHUB_PRIVATE_KEY=$(< /build-credentials/gh-app-private-key)
          export WEBHOOK_SECRET=$(< /build-credentials/gh-app-webhook-secret)
          export QUAY_TOKEN=$(< /build-credentials/quay-org-token)
          export QUAY_ORGANIZATION=$(< /build-credentials/quay-org-name)
          export SMEE_CHANNEL=$(< /build-credentials/smee-channel)

          # Kind already provisioned by the pipeline (mapt). Same operator path as
          # .github/actions/konflux-ui-deploy-test. Quay env auto-selects konflux-e2e.yaml.
          export DEPLOY_LOCAL_SKIP_KIND=1
          export OPERATOR_INSTALL_METHOD=release
          export OPERATOR_RELEASE
          export SET_SKIP_CHECKS=true

          ./scripts/deploy-local.sh

          # Cypress reaches the UI via Kind node IP:9443 (run-e2e retrieve-local-url).
          # Release samples configure oauth2-proxy/Dex for localhost:9443 (local Kind / GHA).
          # Point ingress.fqdn at the node IP so OIDC redirects match the URL Cypress uses
          # (legacy deploy-konflux-ci did the equivalent with sed on dex/proxy manifests).
          # NOTE: released operator CRD field is ingress.fqdn (not the older ingress.host).
          KUBE_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          KIND_IP=$(sed -E 's|https?://([^:/]+).*|\1|' <<< "${KUBE_SERVER}")
          UI_HOST="${KIND_IP}:9443"
          echo "[INFO] Patching Konflux UI ingress.fqdn to ${UI_HOST}"
          kubectl patch konflux konflux --type=merge \
            -p "{\"spec\":{\"ui\":{\"spec\":{\"ingress\":{\"fqdn\":\"${UI_HOST}\"}}}}}"

          echo "[INFO] Waiting for Konflux to reconcile after fqdn patch..."
          kubectl wait --for=condition=Ready=True konflux/konflux --timeout=10m
          kubectl rollout status deployment/proxy -n konflux-ui --timeout=5m || true

          GET_LINE=$(kubectl get konflux konflux -o wide --no-headers 2>/dev/null || true)
          echo "[INFO] Konflux after fqdn patch: ${GET_LINE}"
          if [[ "${GET_LINE}" == *localhost* ]] || [[ "${GET_LINE}" != *"${KIND_IP}"* ]]; then
            echo "ERROR: UI URL did not switch to Kind IP ${KIND_IP} after ingress.fqdn=${UI_HOST}"
            echo "       Got: ${GET_LINE}"
            echo "       OIDC redirects will not match Cypress (chrome-error / missing login button)."
            kubectl get konflux konflux -o yaml | head -120 || true
            exit 1
          fi

          kubectl get po -A || true
        } 2>&1 | tee -a "${LOG_FILENAME}"

    - name: secure-push-oci
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
      params:
        - name: workdir-path
          value: /var/log-dir/
        - name: oci-ref
          value: $(params.oci-ref)
        - name: credentials-volume-name
          value: oci-credentials

    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
