---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: e2e-main-pipeline
  namespace: konflux-ui-tenant
spec:
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      # Should there be test image or UI builded image? Or are there both? Where to find out?
      # Should be verified during https://redhat.atlassian.net/browse/KFLUXUI-1497
      default: '{"components": [{"name":"konflux-ui", "containerImage": "quay.io/konflux_ui_qe/konflux-ui-tests:latest"}]}'
      type: string
    - name: konflux-test-infra-secret
      description: The name of secret where testing infrastructures credentials are stored.
      type: string
      # repository for storing task's artefacts, common for Konflux components
      # visible in dashboard https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com/
    - name: oci-container-repo
      default: 'quay.io/konflux-test-storage/konflux-team/konflux-ui'
      description: The ORAS container used to store all test artifacts.
    - name: artifact-browser-url
      description: 'URL to the artifact browser deployment. If provided, a link will be added to PR comments.'
      default: 'https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com'
      type: string
    - name: github-credentials-secret
      description: 'Secret name containing GitHub token'
      default: 'github-credentials'
      type: string
    - name: cypress-credentials-secret
      description: 'Secret name containing Cypress credentials'
      default: 'cypress-credentials'
      type: string
    - name: cypress-cloud-secret
      description: 'Secret name containing Cypress Cloud credentials'
      default: 'cypress-cloud-credentials'
      type: string
    - name: slack-credentials-secret
      description: 'Secret name containing Slack credentials'
      default: 'slack-credentials'
      type: string
    - name: oci-credentials-secret
      description: 'Secret containing OCI registry credentials (oci-storage-dockerconfigjson key)'
      default: 'quay-repo'
      type: string
    - name: build-credentials-secret
      type: string
      default: build-credentials
    - name: spec-file
      description: 'Cypress test spec file to run (for debugging, run single test)'
      default: 'tests/basic-happy-path.spec.ts'
      type: string
    - name: job-type
      description: 'Type of job (pr-check, periodic-local, periodic-stage)'
      default: 'pr-check'
      type: string
    - name: skip-slack-notification
      description: 'Skip sending the Slack notification'
      default: 'false'
      type: string
    - name: test-image-tag
      description: >-
        Tag for the E2E test image (quay.io/konflux_ui_qe/konflux-ui-tests:<tag>).
        Repository is fixed so PipelineRuns cannot point the secret-bearing step at an arbitrary image.
      default: 'latest'
      type: string
  workspaces:
    # Shared between prepare-e2e-resources and run-e2e-konflux-ui.
    # For pr-check: populated with e2e-tests/ when the PR changes that folder; left empty otherwise.
    # For periodic jobs: always empty — run-e2e uses the test image's baked-in /tmp/e2e sources.
    - name: e2e-source
      description: 'Optional PR e2e test overlay (mounted at /e2e in run-e2e-konflux-ui)'
  tasks:
    - name: test-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test-metadata/0.4/test-metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: provision-kind-cluster
      runAfter:
        - test-metadata
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/provision/0.2/kind-aws-provision.yaml
      params:
        - name: secret-aws-credentials
          value: $(params.konflux-test-infra-secret)
        - name: id
          value: $(context.pipelineRun.name)
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: tags
          value: 'owner=konflux-ui@redhat.com,project=Konflux,created-by=integration-pipeline,component=konflux-ui'
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-credentials-secret)
        - name: cpus
          value: '4'
        - name: memory
          value: '16'

    - name: deploy-konflux
      runAfter:
        - provision-kind-cluster
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/konflux-ci/deploy/0.3/deploy-konflux-ci.yaml
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: component-name
          value: ui
        - name: component-pr-owner
          value: $(tasks.test-metadata.results.pull-request-author)
        - name: component-pr-sha
          value: $(tasks.test-metadata.results.git-revision)
        - name: component-pr-source-branch
          value: $(tasks.test-metadata.results.source-repo-branch)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-credentials-secret)
        - name: build-credentials
          value: $(params.build-credentials-secret)

    - name: prepare-e2e-resources
      runAfter:
        - deploy-konflux
      params:
        - name: job-type
          value: '$(params.job-type)'
        - name: source-repo-url
          value: $(tasks.test-metadata.results.source-repo-url)
        - name: git-revision
          value: $(tasks.test-metadata.results.git-revision)
        - name: target-branch
          value: $(tasks.test-metadata.results.target-repo-branch)
        - name: github-credentials-secret
          value: $(params.github-credentials-secret)
      workspaces:
        - name: e2e-source
          workspace: e2e-source
      taskSpec:
        description: >-
          Prepares resources required before running Konflux UI E2E tests.
          For periodic-local and pr-check jobs, extracts the Konflux base URL from the Kind cluster kubeconfig.
          For periodic-stage, emits an empty base-url result so downstream tasks can use their own URL selection.
          For pr-check jobs, compares e2e-tests/ against the target branch and, when changed, copies the PR
          version into the e2e-source workspace for run-e2e-konflux-ui to mount at /e2e.
        params:
          - name: job-type
            type: string
            default: 'pr-check'
            description: 'Type of job (pr-check, periodic-local, periodic-stage)'
          - name: source-repo-url
            type: string
            description: 'Git URL of the PR source repo (fork or upstream), from test-metadata'
          - name: git-revision
            type: string
            description: 'PR head commit SHA, from test-metadata'
          - name: target-branch
            type: string
            description: 'PR target branch (e.g. main), from test-metadata'
          - name: github-credentials-secret
            type: string
            default: 'github-credentials'
            description: 'Secret containing a GitHub token for cloning private fork repos'
        workspaces:
          - name: e2e-source
            description: 'Receives e2e-tests/ from the PR when that folder changed; stays empty otherwise'
        results:
          - name: base-url
            description: 'Konflux base URL for Cypress tests (https://<kind-ip>:9443)'
        steps:
          - name: setup-base-url
            image: docker.io/bitnami/kubectl@sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d # kubectl 1.36.3
            env:
              - name: TEKTON_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if [ "$(params.job-type)" = "periodic-stage" ]; then
                echo "Skipping Kind cluster setup for periodic-stage"
                : > "$(results.base-url.path)"
                exit 0
              fi

              echo "=== Getting PipelineRun name and kubeconfig ==="

              PIPELINE_RUN_NAME="$(context.pipelineRun.name)"
              NAMESPACE="${TEKTON_NAMESPACE}"
              echo "PipelineRun name: ${PIPELINE_RUN_NAME}"
              echo "Namespace: ${NAMESPACE}"

              # Construct the secret name
              SECRET_NAME="kfg-${PIPELINE_RUN_NAME}"
              echo "Looking for secret: ${SECRET_NAME}"

              # Extract kubeconfig from the secret (0600 so it is not world-readable)
              kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.kubeconfig}' \
                | base64 -d \
                | install -m 0600 /dev/stdin /tmp/kubeconfig

              # Switch to Kind cluster context
              export KUBECONFIG=/tmp/kubeconfig

              echo "=== Extracting Konflux base URL from kubeconfig ==="

              KUBE_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
              echo "Kubernetes API server: ${KUBE_SERVER}"

              # Extract IP address (remove https:// prefix and :6443 port)
              KUBE_IP=$(echo "${KUBE_SERVER}" | sed -E 's|https?://([^:]+):.*|\1|')
              echo "Extracted IP: ${KUBE_IP}"

              CYPRESS_KONFLUX_BASE_URL="https://${KUBE_IP}:9443"
              echo "Konflux base URL: ${CYPRESS_KONFLUX_BASE_URL}"

              echo -n "${CYPRESS_KONFLUX_BASE_URL}" > "$(results.base-url.path)"

              echo "Setup complete. Ready for E2E tests."

          # pr-check only: if there are any changes in e2e-tests/ folder, put PR sources into the workspace
          - name: prepare-e2e-sources
            when:
              - input: '$(params.job-type)'
                operator: in
                values: ['pr-check']
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.github-credentials-secret)
                    key: token
                    optional: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              E2E_WS="$(workspaces.e2e-source.path)"
              REPO_URL="$(params.source-repo-url)"
              GIT_REVISION="$(params.git-revision)"
              TARGET_BRANCH="$(params.target-branch)"

              echo "=== Checking for e2e-tests/ changes (pr-check) ==="
              echo "Source repo: ${REPO_URL}"
              echo "PR revision: ${GIT_REVISION}"
              echo "Target branch: ${TARGET_BRANCH}"
              echo "Workspace: ${E2E_WS}"

              # Authenticate git for private fork clones (public repos work without a token too).
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                git config --global http.extraheader "AUTHORIZATION: bearer ${GITHUB_TOKEN}"
              fi

              git init /tmp/repo
              cd /tmp/repo
              git remote add origin "${REPO_URL}"
              git fetch origin "${TARGET_BRANCH}" "${GIT_REVISION}" --depth=1

              if git diff --quiet "origin/${TARGET_BRANCH}" "${GIT_REVISION}" -- e2e-tests/; then
                echo "No e2e-tests/ changes detected — workspace left empty (run-e2e will use image sources)"
                exit 0
              fi

              echo "e2e-tests/ changed — copying PR version into shared workspace"
              git checkout "${GIT_REVISION}" -- e2e-tests/
              cp -a e2e-tests/. "${E2E_WS}/"

              echo "Staged $(find "${E2E_WS}" -type f | wc -l) files under ${E2E_WS}"

    - name: monitor-webhook-logs
      runAfter:
        - deploy-konflux
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .integration-tests/tasks/monitor-webhook-logs.yaml
      params:
        - name: monitoring-duration
          value: '5m'

    - name: run-e2e-konflux-ui
      runAfter:
        - prepare-e2e-resources
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .integration-tests/tasks/run-e2e-konflux-ui.yaml
      params:
        - name: job-type
          value: '$(params.job-type)'
          # oci for storing artefacts
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-credentials-secret)
        - name: test-image-tag
          value: $(params.test-image-tag)
        - name: spec-file
          value: $(params.spec-file)
        - name: github-credentials-secret
          value: $(params.github-credentials-secret)
        - name: cypress-credentials-secret
          value: $(params.cypress-credentials-secret)
        - name: cypress-cloud-secret
          value: $(params.cypress-cloud-secret)
        - name: konflux-base-url
          value: $(tasks.prepare-e2e-resources.results.base-url)
      workspaces:
        - name: e2e-source
          workspace: e2e-source
  finally:
    - name: deprovision-kind-cluster
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/deprovision/0.1/kind-aws-deprovision.yaml
      params:
        - name: secret-aws-credentials
          value: $(params.konflux-test-infra-secret)
        - name: id
          value: $(context.pipelineRun.name)
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-credentials-secret)
        - name: pipeline-aggregate-status
          value: '$(tasks.status)'

    - name: pull-request-status-message
      when:
        - input: '$(params.job-type)'
          operator: notin
          values: ['periodic-stage', 'periodic-local']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/pull-request-comment/0.2/pull-request-comment.yaml
      params:
        - name: test-name
          value: '$(context.pipelineRun.name)'
        - name: oci-container
          value: '$(params.oci-container-repo):$(context.pipelineRun.name)'
        - name: job-spec
          value: '$(tasks.test-metadata.results.job-spec)'
        - name: pipeline-aggregate-status
          value: '$(tasks.status)'
        - name: junit-report-name
          value: e2e-report.xml
        - name: enable-test-results-analysis
          value: 'true'
        - name: artifact-browser-url
          value: '$(params.artifact-browser-url)'

    - name: send-slack-notification
      when:
        - input: '$(params.skip-slack-notification)'
          operator: notin
          values: ['true']
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .integration-tests/tasks/send-slack-notification.yaml
      params:
        - name: pipeline-aggregate-status
          value: '$(tasks.status)'
        - name: test-name
          value: '$(context.pipelineRun.name)'
        - name: job-type
          value: '$(params.job-type)'
        - name: slack-credentials-secret
          value: $(params.slack-credentials-secret)
