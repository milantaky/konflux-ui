apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/milantaky/konflux-ui?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'false'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "feat/push-test"
  labels:
    appstudio.openshift.io/application: docker-test
    appstudio.openshift.io/component: push-new-test-image
    pipelines.appstudio.openshift.io/type: build
  name: push-new-test-image-on-push
  namespace: mtakac-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads-stage/mtakac-tenant/push-new-test-image:{{revision}}
    - name: dockerfile
      value: Dockerfile
    - name: path-context
      value: .
    - name: build-image-index
      value: 'true'
    - name: build-platforms
      value:
        - linux/x86_64
    - name: hermetic
      value: 'true'
    - name: prefetch-input
      value: '{"type": "yarn", "path": "."}'
    - name: e2e-output-image
      value: quay.io/redhat-user-workloads-stage/mtakac-tenant/push-new-test-image:e2e-{{revision}}
    - name: e2e-qe-output-image
      value: quay.io/konflux_ui_qe/konflux-ui-tests:konflux
    - name: e2e-dockerfile
      value: Containerfile
    - name: e2e-path-context
      value: e2e-tests
    - name: e2e-prefetch-input
      value: '{"type": "yarn", "path": "e2e-tests"}'
  pipelineSpec:
    description: |
      This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

      _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
      This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
    params:
      - description: Source Repository URL
        name: git-url
        type: string
      - default: ''
        description: Revision of the Source Repository
        name: revision
        type: string
      - description: Fully Qualified Output Image
        name: output-image
        type: string
      - default: .
        description: Path to the source code of an application's component from where to build image.
        name: path-context
        type: string
      - default: Dockerfile
        description: Path to the Dockerfile inside the context specified by parameter path-context
        name: dockerfile
        type: string
      - default: 'false'
        description: Skip checks against built image
        name: skip-checks
        type: string
      - default: 'false'
        description: Execute the build with network isolation
        name: hermetic
        type: string
      - default: ''
        description: Build dependencies to be prefetched by Cachi2
        name: prefetch-input
        type: string
      - default: ''
        description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
        name: image-expires-after
      - default: 'false'
        description: Build a source image.
        name: build-source-image
        type: string
      - default: 'false'
        description: Add built image into an OCI image index
        name: build-image-index
        type: string
      - default: []
        description: Array of --build-arg values ("arg=value" strings) for buildah
        name: build-args
        type: array
      - default: ''
        description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
        name: build-args-file
        type: string
      - default:
          - linux/x86_64
        description: List of platforms to build the container image on
        name: build-platforms
        type: array
      - name: buildah-format
        default: docker
        type: string
        description: The format for the resulting image's mediaType. Valid values are oci or docker.
      - name: source-date-epoch
        type: string
        default: ''
        description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
      - name: rewrite-timestamp
        type: string
        default: 'false'
        description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
      - name: omit-history
        type: string
        default: 'false'
        description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
      - description: Fully qualified output image for the E2E test runner
        name: e2e-output-image
        type: string
      - default: quay.io/konflux_ui_qe/konflux-ui-tests:konflux
        description: |
          Public QE Quay tag updated after each push (skopeo copy from e2e-output-image).
          Requires a dockerconfigjson secret with write access to this repository linked on
          ServiceAccount build-pipeline-push-new-test-image (see e2e-tests/README.md).
        name: e2e-qe-output-image
        type: string
      - default: Containerfile
        name: e2e-dockerfile
        type: string
      - default: e2e-tests
        name: e2e-path-context
        type: string
      - default: ''
        name: e2e-prefetch-input
        type: string
    results:
      - description: ''
        name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - description: ''
        name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - description: ''
        name: E2E_IMAGE_URL
        value: $(tasks.build-e2e-container.results.IMAGE_URL)
      - description: ''
        name: E2E_IMAGE_DIGEST
        value: $(tasks.build-e2e-container.results.IMAGE_DIGEST)
      - description: ''
        name: CHAINS-GIT_URL
        value: $(tasks.clone-repository.results.url)
      - description: ''
        name: CHAINS-GIT_COMMIT
        value: $(tasks.clone-repository.results.commit)
    tasks:
      - name: init
        taskRef:
          params:
            - name: name
              value: init
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:7854d7babe4136e53e337f6433d952532314433b48bb62b422ddc02700934d85
            - name: kind
              value: task
          resolver: bundles
      - name: clone-repository
        params:
          - name: url
            value: $(params.git-url)
          - name: revision
            value: $(params.revision)
          - name: ociStorage
            value: $(params.output-image).git
          - name: ociArtifactExpiresAfter
            value: $(params.image-expires-after)
        runAfter:
          - init
        taskRef:
          params:
            - name: name
              value: git-clone-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
            - name: kind
              value: task
          resolver: bundles
        workspaces:
          - name: basic-auth
            workspace: git-auth
      - name: prefetch-dependencies
        params:
          - name: input
            value: $(params.prefetch-input)
          - name: SOURCE_ARTIFACT
            value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
          - name: ociStorage
            value: $(params.output-image).prefetch
          - name: ociArtifactExpiresAfter
            value: $(params.image-expires-after)
        runAfter:
          - clone-repository
        taskRef:
          params:
            - name: name
              value: prefetch-dependencies-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
            - name: kind
              value: task
          resolver: bundles
        workspaces:
          - name: git-basic-auth
            workspace: git-auth
          - name: netrc
            workspace: netrc
      - name: prefetch-e2e-dependencies
        params:
          - name: input
            value: $(params.e2e-prefetch-input)
          - name: SOURCE_ARTIFACT
            value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
          - name: ociStorage
            value: $(params.e2e-output-image).prefetch
          - name: ociArtifactExpiresAfter
            value: $(params.image-expires-after)
        runAfter:
          - clone-repository
        taskRef:
          params:
            - name: name
              value: prefetch-dependencies-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.3@sha256:0c386f2c26b46b978280c5c54caac26bcd524975f8f7cc06bb080ba00eae3ad4
            - name: kind
              value: task
          resolver: bundles
        workspaces:
          - name: git-basic-auth
            workspace: git-auth
          - name: netrc
            workspace: netrc
      - name: build-e2e-container
        params:
          - name: IMAGE
            value: $(params.e2e-output-image)
          - name: DOCKERFILE
            value: $(params.e2e-dockerfile)
          - name: CONTEXT
            value: $(params.e2e-path-context)
          - name: HERMETIC
            value: 'false'
          - name: PREFETCH_INPUT
            value: $(params.e2e-prefetch-input)
          - name: IMAGE_EXPIRES_AFTER
            value: $(params.image-expires-after)
          - name: COMMIT_SHA
            value: $(tasks.clone-repository.results.commit)
          - name: BUILD_ARGS
            value:
              - $(params.build-args[*])
          - name: SOURCE_URL
            value: $(tasks.clone-repository.results.url)
          - name: BUILDAH_FORMAT
            value: $(params.buildah-format)
          - name: SOURCE_DATE_EPOCH
            value: $(params.source-date-epoch)
          - name: REWRITE_TIMESTAMP
            value: $(params.rewrite-timestamp)
          - name: OMIT_HISTORY
            value: $(params.omit-history)
          - name: SOURCE_ARTIFACT
            value: $(tasks.prefetch-e2e-dependencies.results.SOURCE_ARTIFACT)
          - name: CACHI2_ARTIFACT
            value: $(tasks.prefetch-e2e-dependencies.results.CACHI2_ARTIFACT)
          - name: BUILD_ARGS_FILES
            value:
              - $(params.build-args-file)
        runAfter:
          - prefetch-e2e-dependencies
        taskRef:
          params:
            - name: name
              value: buildah-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.13.0@sha256:5962a3531a56ab393e6590c4ecedebd5d7ace3fe57f6cc37bec6b4ea838204cf
            - name: kind
              value: task
          resolver: bundles
      - name: apply-tags-e2e
        params:
          - name: IMAGE_URL
            value: $(tasks.build-e2e-container.results.IMAGE_URL)
          - name: IMAGE_DIGEST
            value: $(tasks.build-e2e-container.results.IMAGE_DIGEST)
        runAfter:
          - build-e2e-container
        taskRef:
          params:
            - name: name
              value: apply-tags
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3.2@sha256:a1d5e6d0912de4e39a19b4aa5587526cb8b20260ac32d00ac5c8c4581e3c2ea1
            - name: kind
              value: task
          resolver: bundles
      # Mirror the e2e runner to QE Quay (KFLUXUI-1731).
      # Destination auth is mounted from quay-repo-katy explicitly: linking alone is
      # not enough when another quay.io dockerconfig (image-push) already wins the
      # Tekton-merged ~/.docker/config.json entry for the quay.io host.
      - name: publish-e2e-qe-image
        params:
          - name: SOURCE_IMAGE_URL
            value: $(tasks.build-e2e-container.results.IMAGE_URL)
          - name: SOURCE_IMAGE_DIGEST
            value: $(tasks.build-e2e-container.results.IMAGE_DIGEST)
          - name: DESTINATION_IMAGE_URL
            value: $(params.e2e-qe-output-image)
        runAfter:
          - apply-tags-e2e
        taskSpec:
          params:
            - name: SOURCE_IMAGE_URL
              type: string
            - name: SOURCE_IMAGE_DIGEST
              type: string
            - name: DESTINATION_IMAGE_URL
              type: string
          volumes:
            - name: qe-quay-auth
              secret:
                secretName: quay-repo-katy
          steps:
            - name: skopeo-copy
              image: registry.access.redhat.com/ubi9/skopeo@sha256:4a6e11dff9b438151056f5d3c3d3c040852d4138c7def4b56280d78a292c7ad9
              volumeMounts:
                - name: qe-quay-auth
                  mountPath: /etc/qe-quay-auth
                  readOnly: true
              script: |
                #!/usr/bin/env bash
                set -euo pipefail

                SRC_TAGGED="$(params.SOURCE_IMAGE_URL)"
                DIGEST="$(params.SOURCE_IMAGE_DIGEST)"
                DEST="$(params.DESTINATION_IMAGE_URL)"
                DEST_AUTH="/etc/qe-quay-auth/.dockerconfigjson"

                echo "SRC_TAGGED=${SRC_TAGGED}"
                echo "DIGEST=${DIGEST}"
                echo "DEST=${DEST}"
                echo "DEST_AUTH=${DEST_AUTH}"
                ls -la /etc/qe-quay-auth

                # IMAGE_URL is always repo:tag; strip tag and pin by digest
                # (containers/image rejects name:tag@digest).
                SRC="${SRC_TAGGED%:*}@${DIGEST}"
                echo "SRC=${SRC}"

                echo "Copying docker://${SRC} -> docker://${DEST}"
                skopeo copy --all --dest-authfile="${DEST_AUTH}" \
                  "docker://${SRC}" "docker://${DEST}"
                echo "Copy finished successfully"
      - matrix:
          params:
            - name: PLATFORM
              value:
                - $(params.build-platforms)
        name: build-images
        params:
          - name: IMAGE
            value: $(params.output-image)
          - name: DOCKERFILE
            value: $(params.dockerfile)
          - name: CONTEXT
            value: $(params.path-context)
          - name: HERMETIC
            value: $(params.hermetic)
          - name: PREFETCH_INPUT
            value: $(params.prefetch-input)
          - name: IMAGE_EXPIRES_AFTER
            value: $(params.image-expires-after)
          - name: COMMIT_SHA
            value: $(tasks.clone-repository.results.commit)
          - name: BUILD_ARGS
            value:
              - $(params.build-args[*])
          - name: SOURCE_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
          - name: CACHI2_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
          - name: BUILDAH_FORMAT
            value: $(params.buildah-format)
          - name: SOURCE_DATE_EPOCH
            value: $(params.source-date-epoch)
          - name: REWRITE_TIMESTAMP
            value: $(params.rewrite-timestamp)
          - name: OMIT_HISTORY
            value: $(params.omit-history)
          - name: BUILD_ARGS_FILES
            value:
              - $(params.build-args-file)
        runAfter:
          - prefetch-dependencies
        taskRef:
          params:
            - name: name
              value: buildah-remote-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah-remote-oci-ta:0.12.1@sha256:f34d44fd81608a76644b3af2784ee9d3ffb7eae57e33242b0b1ef1aeca57c9ac
            - name: kind
              value: task
          resolver: bundles
      - name: build-image-index
        params:
          - name: IMAGE
            value: $(params.output-image)
          - name: ALWAYS_BUILD_INDEX
            value: $(params.build-image-index)
          - name: IMAGES
            value:
              - $(tasks.build-images.results.IMAGE_REF[*])
          - name: BUILDAH_FORMAT
            value: $(params.buildah-format)
        runAfter:
          - build-images
        taskRef:
          params:
            - name: name
              value: build-image-index
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3.1@sha256:1e2e00be81beae3645588957a8c29645660d2614db1063cfded85509bf9124fb
            - name: kind
              value: task
          resolver: bundles
      - name: build-source-image
        params:
          - name: BINARY_IMAGE
            value: $(tasks.build-image-index.results.IMAGE_URL)
          - name: BINARY_IMAGE_DIGEST
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
          - name: SOURCE_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
          - name: CACHI2_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: source-build-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3.2@sha256:45091b5022754d452b4de60c7d7f4c6e03626efff55f96e9af937400fe3506eb
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.build-source-image)
            operator: in
            values:
              - 'true'
      - name: sast-unicode-check
        params:
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
          - name: SOURCE_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
          - name: CACHI2_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
          - name: image-digest
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: sast-unicode-check-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:15d654c9576b9c4ee1f78b09fce541acf9afe33f1c2363fd6219a79dbf62c95d
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
        workspaces: []
      - name: coverity-availability-check
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: coverity-availability-check
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-coverity-availability-check:0.2@sha256:8b501440a960aec446db2ebc6625a49d0317a9fc7bf0f7bd9b18cb63052db7de
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
      - name: deprecated-base-image-check
        params:
          - name: IMAGE_URL
            value: $(tasks.build-image-index.results.IMAGE_URL)
          - name: IMAGE_DIGEST
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: deprecated-image-check
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:81b7cad8d5fd0148b157d622f4064f57d38aa33c142275050c8a4727d1e2144c
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
      - matrix:
          params:
            - name: image-platform
              value:
                - $(params.build-platforms)
        name: roxctl-scan
        params:
          - name: image-digest
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: roxctl-scan
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-roxctl-scan:0.1@sha256:e398b9ddfc422639c2e245285577b01b8c25cc141a2563e1d85449d96b619752
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
      - name: ecosystem-cert-preflight-checks
        params:
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: ecosystem-cert-preflight-checks
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:439014132f4521ea3221ea29b1fd83e48f9728c071db6edaf6b870550e5d89a6
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
      - name: sast-snyk-check
        params:
          - name: image-digest
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
          - name: SOURCE_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
          - name: CACHI2_ARTIFACT
            value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: sast-snyk-check-oci-ta
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5@sha256:17b9587eba53fabaab35061275306bfe1f99661d55e14e22f62321fa7cb5ff3e
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
      - name: clamav-scan
        params:
          - name: image-digest
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
        runAfter:
          - build-image-index
        taskRef:
          params:
            - name: name
              value: clamav-scan
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:6fe7e04cef9d999aeb62a29839df82a24fd4841c93998bb0c4ef3cd9a69288c2
            - name: kind
              value: task
          resolver: bundles
        when:
          - input: $(params.skip-checks)
            operator: in
            values:
              - 'false'
        matrix:
          params:
            - name: image-arch
              value:
                - $(params.build-platforms)
      - name: sast-coverity-check
        params:
          - name: image-digest
            value: $(tasks.build-image-index.results.IMAGE_DIGEST)
          - name: image-url
            value: $(tasks.build-image-index.results.IMAGE_URL)
          - name: IMAGE
            value: $(params.output-image)
          - name: DOCKERFILE
            value: $(params.dockerfile)
          - name: CONTEXT
            value: $(params.path-context)
          - name: HERMETIC
            value: $(params.hermetic)
          - name: PREFETCH_INPUT
            value: $(params.prefetch-input)
          - name: IMAGE_EXPIRES_AFTER
            value: $(params.image-expires-after)
          - name: COMMIT_SHA
